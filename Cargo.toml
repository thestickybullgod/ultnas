[workspace]
resolver = "2"
members = [
    "ultnas-core",
    "ultnas-cli",
    "ultnas-daemon",
    "ultnas-gui",
]

[workspace.package]
version       = "0.1.0"
edition       = "2021"
rust-version  = "1.89"
authors       = ["Dustin Wayne Deen <sovereignarchivist@outlook.com>"]
license       = "GPL-3.0-or-later"
repository    = "https://github.com/thestickybullgod/ultnas"
homepage      = "https://github.com/thestickybullgod/ultnas"

[workspace.dependencies]
blake3            = "1.5"
ed25519-dalek     = "2.1"
rand              = "0.8"
serde             = { version = "1", features = ["derive"] }
serde_json        = "1"
toml              = "0.8"
thiserror         = "1"
anyhow            = "1"
tokio             = { version = "1", features = ["full"] }
clap              = { version = "4", features = ["derive", "color", "env"] }
clap_complete     = "4"
clap_mangen       = "0.2"
tracing           = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tracing-appender  = "0.2.3"
chrono            = { version = "0.4", features = ["serde"] }
walkdir           = "2"
tempfile          = "3"
hex               = "0.4"
libc              = "0.2"
notify            = "8"
# Desktop app (Linux). GTK 4.6 and libadwaita 1.1 are the floor: Ubuntu 22.04.
gtk               = { package = "gtk4", version = "0.11", features = ["v4_6"] }
adw               = { package = "libadwaita", version = "0.9", features = ["v1_1"] }
async-channel     = "2"
similar           = "2"

[profile.release]
opt-level     = 3
lto           = true
codegen-units = 1
strip         = "symbols"
