name: Debian package

# Run by hand for a test package, and by release.yml for tagged releases
# (which attaches the .deb to the release).
on:
  workflow_dispatch:
  workflow_call:

env:
  CARGO_TERM_COLOR: always

jobs:
  deb:
    name: Build and smoke-test the .deb
    # The oldest supported runner, so the package's glibc requirement stays low.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-deb
        run: cargo install cargo-deb --locked

      # The oldest supported runner also pins the desktop app's floor:
      # GTK 4.6 and libadwaita 1.1.
      - name: Install GTK development files and desktop-file checkers
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libadwaita-1-dev desktop-file-utils appstream

      - name: Build release binaries
        run: cargo build --workspace --release --locked

      - name: Generate man pages and completions
        run: |
          mkdir -p target/assets
          ./target/release/ultnas manpage | gzip -9n > target/assets/ultnas.1.gz
          ./target/release/ultnasd --manpage | gzip -9n > target/assets/ultnasd.1.gz
          ./target/release/ultnas completions bash > target/assets/ultnas.bash
          ./target/release/ultnas completions zsh > target/assets/_ultnas
          ./target/release/ultnas completions fish > target/assets/ultnas.fish

      - name: Build .deb
        run: |
          cargo deb -p ultnas-cli --no-build
          cargo deb -p ultnas-gui --no-build

      - name: Inspect package
        run: |
          for deb in target/debian/*.deb; do
            dpkg-deb --info "$deb"
            dpkg-deb --contents "$deb"
          done
          # The app must require exactly the ultnas package built here (they
          # share the vault format); cargo-deb can't fill it in, so it's
          # written out in ultnas-gui/Cargo.toml.
          version=$(dpkg-deb -f target/debian/ultnas_*.deb Version)
          depends=$(dpkg-deb -f target/debian/ultnas-gui_*.deb Depends)
          echo "ultnas-gui Depends: $depends"
          if ! grep -qF "ultnas (= $version)" <<<"$depends"; then
            echo "::error::ultnas-gui must depend on ultnas (= $version); update depends in ultnas-gui/Cargo.toml"
            exit 1
          fi

      - name: Install and smoke-test
        run: |
          sudo apt-get install -y ./target/debian/*.deb
          ultnas --version
          ultnasd --version
          man -w ultnas ultnasd
          test -f /usr/lib/systemd/user/ultnasd.service
          test -f /usr/lib/systemd/system/ultnasd.service

          # The desktop app: starts far enough to answer without a display,
          # and its desktop entry and AppStream metadata are valid.
          ultnas-gui --version
          desktop-file-validate /usr/share/applications/org.planetarchives.Ultnas.desktop
          appstreamcli validate --no-net /usr/share/metainfo/org.planetarchives.Ultnas.metainfo.xml
          test -f /usr/share/icons/hicolor/scalable/apps/org.planetarchives.Ultnas.svg

          export ULTNAS_VAULT="$RUNNER_TEMP/vault"
          ultnas init --name smoke
          printf 'is_admin = false\n' > "$RUNNER_TEMP/config.txt"
          ultnas track "$RUNNER_TEMP/config.txt"

          ultnasd --no-log-file &
          pid=$!
          for _ in $(seq 100); do
            ultnas daemon status --json 2>/dev/null | grep -q '"last_full_scan": "' && break
            sleep 0.2
          done

          # A zero-width space written into the file must be stripped.
          printf 'is_\xe2\x80\x8badmin = false\n' > "$RUNNER_TEMP/config.txt"
          for _ in $(seq 100); do
            grep -q $'\xe2\x80\x8b' "$RUNNER_TEMP/config.txt" || break
            sleep 0.1
          done
          if grep -q $'\xe2\x80\x8b' "$RUNNER_TEMP/config.txt"; then
            echo "::error::the installed daemon did not repair the attack"
            exit 1
          fi
          ultnas daemon status
          ultnas daemon stop
          wait "$pid"

          # Bulk tracking: 3000 files, about the size of /etc.
          mkdir -p "$RUNNER_TEMP/bulk"
          for i in $(seq 3000); do printf 'setting_%d = %d\n' "$i" "$i" > "$RUNNER_TEMP/bulk/f$i.conf"; done
          start=$(date +%s.%N)
          ultnas track -r --yes "$RUNNER_TEMP/bulk" | tail -n 2
          echo "bulk track of 3000 files took $(echo "$(date +%s.%N) - $start" | bc) s"
          test "$(ultnas tracked | grep -c '\.conf$')" -eq 3000

          # Removing ultnas takes ultnas-gui with it (it depends on ultnas).
          sudo apt-get remove -y ultnas
          # (not `command -v`: bash caches the path it found earlier)
          test ! -e /usr/bin/ultnas && test ! -e /usr/bin/ultnasd && test ! -e /usr/bin/ultnas-gui

      - uses: actions/upload-artifact@v4
        with:
          name: ultnas-deb
          path: target/debian/*.deb
